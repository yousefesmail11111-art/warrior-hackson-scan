<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Cyber Grid Lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="180" stroke="#334155" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Shield Core -->
  <g filter="url(#shadow)">
    <path d="M256 90 L390 150 C390 270 330 370 256 422 C182 370 122 270 122 150 Z" 
          fill="#0f172a" 
          stroke="url(#shield-grad)" 
          stroke-width="12" 
          stroke-linejoin="round" />
  </g>

  <!-- Inner Circuit & Android Mobile Silhouette -->
  <rect x="206" y="170" width="100" height="175" rx="18" fill="#1e1b4b" stroke="url(#glow-grad)" stroke-width="6" />
  <circle cx="256" cy="320" r="8" fill="#10b981" />
  <line x1="236" y1="190" x2="276" y2="190" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

  <!-- Security Pulse Lines -->
  <path d="M220 256 L245 256 L256 235 L268 275 L280 256 L292 256" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Shield Star Accent -->
  <circle cx="256" cy="120" r="6" fill="#38bdf8" />
</svg>
